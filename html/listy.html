<!DOCTYPE html>
<html lang="pl">
    <head>
        <meta charset="UTF-8" />
        <title>Listy</title>
    </head>
    <body>
    <h1>Lista nieuporządkowana</h1>
        <ul style="list-style-type:circle">
            <li> masło</li>
            <li> mleko</li>
            <li>majonez</li>
        </ul>
        <h2>Lista numerowana</h2>
        <ol start="10">
            <li>pierwszy</li>
            <li>drugi</li>
            <li>trzeci</li>
        </ol>
        <h3>Listy mieszane</h3>
        <ol>
            <li>tea:</li>
             <ul>
                <li>white</li>
                <li>green</li>
                <li>black</li>
             </ul>
            
            <li>coffee</li>
            <ul>
                <li>white</li>
                <li>black</li>
            
            </ul>
        </ol>
        <h4>Lista opisowa</h4>
        <dl>
            <dt>termin1</dt>
                <dd>opis terminu</dd>
            <dt>termin2</dt>
                <dd>opis terminu</dd>
        </dl>
    </body>
</html>

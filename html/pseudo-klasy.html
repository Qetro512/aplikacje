<!DOCTYPE html>
<html lang="pl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Pseudo-class links</title>
    <style>
    /* nie odwiedzona strona: */
a:link {
color: red;
}
/* odwiedzona strona: */
a:visited {
	color:green;
} 
    </style>  
</head>
<body>
	<h1>Pseudo-class links</h1>
    <a href="https://www.example.com">Example links</a>
</body>
</html>
